<!DOCTYPE html><html lang="zh-TW"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>MochiLog 日系減肥手帳</title><style>:root{--bg:#FDFBF7;--pink:#E8C5C8;--soft-pink:#F7EAEB;--green:#A8BBA2;--sage:#EBF1EA;--dark:#3E3A39;--muted:#8C8685;--card:#FFF;--border:#F0ECE9;--shadow:0 4px 20px rgba(232,197,200,0.15)}*{box-sizing:border-box;margin:0;padding:0;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",Roboto,sans-serif}body{background:var(--bg);color:var(--dark);max-width:480px;margin:0 auto;min-height:100vh;padding-bottom:90px}.header{padding:24px 20px 12px;display:flex;justify-space:between;align-items:center}.header .date{font-size:13px;color:var(--muted);letter-spacing:1px}.header h1{font-size:22px;font-weight:500;margin-top:2px}.container{padding:0 20px;display:flex;flex-direction:column;gap:16px}.card{background:var(--card);border-radius:20px;padding:20px;box-shadow:var(--shadow);border:1px solid var(--border)}.card-header{display:flex;justify-space:between;align-items:center;margin-bottom:14px}.card-title{font-size:15px;font-weight:500;display:flex;align-items:center;gap:8px}.card-subtitle{font-size:12px;color:var(--muted)}.summary-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}.metric-box{background:var(--bg);border-radius:14px;padding:10px 8px;text-align:center}.metric-value{font-size:16px;font-weight:600;margin:4px 0}.metric-label{font-size:10px;color:var(--muted)}.btn{background:var(--soft-pink);color:var(--dark);border:none;padding:8px 14px;border-radius:12px;font-size:12px;font-weight:500;cursor:pointer}.btn-primary{background:var(--pink);color:#FFF}.btn-green{background:var(--green);color:#FFF}.input-field,.journal-box{width:100%;padding:10px 12px;border-radius:12px;border:1px solid var(--border);background:var(--bg);font-size:13px;outline:0}.journal-box{height:70px;resize:none}.mood-selector{display:flex;gap:12px;margin-bottom:10px}.mood-btn{font-size:20px;opacity:.5;cursor:pointer}.mood-btn.active{opacity:1;transform:scale(1.2)}.todo-item{display:flex;align-items:center;justify-space:between;padding:10px 12px;background:var(--bg);border-radius:12px;margin-bottom:8px}.todo-item.completed .todo-text{text-decoration:line-through;color:var(--muted)}.todo-item.completed .checkbox{background:var(--pink)}.checkbox{width:18px;height:18px;border-radius:6px;border:1.5px solid var(--pink);cursor:pointer}.toast{position:fixed;top:20px;left:50%;transform:translateX(-50%) translateY(-100px);background:var(--dark);color:#FFF;padding:10px 18px;border-radius:20px;font-size:12px;transition:transform .4s;z-index:1000}.toast.show{transform:translateX(-50%) translateY(0)}</style></head><body><div id="toast" class="toast">✨ 操作成功！</div><div class="header"><div><div class="date" id="currentDate"></div><h1>今日手帳</h1></div></div><div class="container"><div class="card"><div class="card-header"><div class="card-title">今日總覽</div></div><div class="summary-grid"><div class="metric-box"><div class="metric-label">目前體重</div><div class="metric-value" id="weightDisplay">52.5</div><div class="metric-label">kg</div></div><div class="metric-box"><div class="metric-label">攝取</div><div class="metric-value" id="calIn">450</div><div class="metric-label">kcal</div></div><div class="metric-box"><div class="metric-label">消耗</div><div class="metric-value" id="calOut" style="color:var(--green)">0</div><div class="metric-label">kcal</div></div></div></div><div class="card"><div class="card-header"><div class="card-title">⚖️ 晨間體重紀錄</div></div><div style="display:flex;gap:8px"><input type="number" step="0.1" id="weightInput" class="input-field" value="52.5"><button class="btn btn-primary" onclick="logWeight()">紀錄</button></div></div><div class="card"><div class="card-header"><div class="card-title">📖 心情減肥日記</div></div><div class="mood-selector"><span class="mood-btn active" onclick="selectMood(this)">🌸</span><span class="mood-btn" onclick="selectMood(this)">🌿</span><span class="mood-btn" onclick="selectMood(this)">☁️</span><span class="mood-btn" onclick="selectMood(this)">☕</span><span class="mood-btn" onclick="selectMood(this)">✨</span></div><textarea id="journalInput" class="journal-box" placeholder="寫下今天的心情小語..."></textarea><div style="text-align:right;margin-top:8px"><button class="btn btn-primary" onclick="saveJournal()">保存日記</button></div></div><div class="card"><div class="card-header"><div class="card-title">✅ 每日健康待辦</div></div><div class="todo-item" id="todo-weight"><div style="display:flex;gap:10px;align-items:center"><div class="checkbox" onclick="toggleTodo(this)"></div><span class="todo-text">晨間量體重並紀錄</span></div></div><div class="todo-item" id="todo-journal"><div style="display:flex;gap:10px;align-items:center"><div class="checkbox" onclick="toggleTodo(this)"></div><span class="todo-text">撰寫今日減肥小日記</span></div></div></div></div><script>document.getElementById('currentDate').innerText=new Date().toLocaleDateString('zh-TW',{month:'long',day:'numeric',weekday:'short'});function showToast(m){const t=document.getElementById('toast');t.innerText=m;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2500)}function logWeight(){const v=document.getElementById('weightInput').value;if(!v)return;document.getElementById('weightDisplay').innerText=v;showToast('⚖️ 體重紀錄成功：'+v+' kg');document.getElementById('todo-weight').classList.add('completed')}function selectMood(e){document.querySelectorAll('.mood-btn').forEach(m=>m.classList.remove('active'));e.classList.add('active')}function saveJournal(){if(!document.getElementById('journalInput').value.trim())return;showToast('📖 日記已保存！');document.getElementById('todo-journal').classList.add('completed')}function toggleTodo(e){e.closest('.todo-item').classList.toggle('completed')}</script></body></html>
